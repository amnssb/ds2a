<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DeepSeek 网关控制台 (企业级增强版)</title>
<style>
  :root {
    --bg: #090d13;
    --panel: #121820;
    --panel2: #182230;
    --line: #222f42;
    --fg: #e2e8f0;
    --dim: #7f8ea3;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --ok: #10b981;
    --ok-bg: #064e3b;
    --warn: #f59e0b;
    --warn-bg: #78350f;
    --err: #ef4444;
    --err-bg: #7f1d1d;
    --purple: #8b5cf6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  a { color: var(--accent); text-decoration: none; }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 50;
  }
  header h1 {
    font-size: 15px;
    margin: 0;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--ok);
    box-shadow: 0 0 10px var(--ok);
  }
  .dot.off {
    background: var(--err);
    box-shadow: 0 0 10px var(--err);
  }
  header .meta {
    color: var(--dim);
    font-size: 12px;
    display: flex;
    gap: 14px;
    align-items: center;
  }
  header .right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  nav {
    display: flex;
    gap: 4px;
    padding: 0 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    overflow-x: auto;
  }
  nav button {
    background: transparent;
    border: none;
    color: var(--dim);
    padding: 11px 15px;
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
    border-bottom: 2px solid transparent;
    transition: 0.15s;
    white-space: nowrap;
  }
  nav button:hover { color: var(--fg); }
  nav button.on {
    color: var(--accent);
    font-weight: 500;
    border-bottom-color: var(--accent);
  }
  button.btn {
    background: var(--panel2);
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 12px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: 0.15s;
  }
  button.btn:hover { border-color: var(--accent); }
  button.btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  button.btn.primary:hover { background: var(--accent-hover); }
  button.btn.success {
    background: #059669;
    border-color: #059669;
    color: #fff;
  }
  button.btn.warning {
    background: #d97706;
    border-color: #d97706;
    color: #fff;
  }
  button.btn.danger {
    color: #fca5a5;
    background: #450a0a;
    border-color: #991b1b;
  }
  button.btn.danger:hover { background: #7f1d1d; }
  main {
    padding: 20px 24px;
    max-width: 1600px;
    margin: 0 auto;
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin-bottom: 20px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .card .k {
    color: var(--dim);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .card .v {
    font-size: 22px;
    font-weight: 600;
    margin-top: 6px;
    font-variant-numeric: tabular-nums;
  }
  .card .s {
    color: var(--dim);
    font-size: 11px;
    margin-top: 4px;
  }
  h2 {
    font-size: 13px;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin: 22px 0 10px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    font-size: 12.5px;
  }
  th, td {
    padding: 10px 14px;
    text-align: left;
    border-bottom: 1px solid var(--line);
  }
  th {
    background: var(--panel2);
    color: var(--dim);
    font-weight: 500;
    font-size: 11.5px;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,0.015); }
  code {
    background: rgba(255,255,255,0.06);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11.5px;
  }
  .tag {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 500;
  }
  .t-ok { background: var(--ok-bg); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.3); }
  .t-err { background: var(--err-bg); color: #fca5a5; border: 1px solid rgba(239,68,68,0.3); }
  .t-warn { background: var(--warn-bg); color: #fcd34d; border: 1px solid rgba(245,158,11,0.3); }
  .t-info { background: #1e3a5f; color: #93c5fd; border: 1px solid rgba(59,130,246,0.3); }
  .t-dim { background: rgba(255,255,255,0.06); color: var(--dim); }
  .muted { color: var(--dim); }
  .empty {
    padding: 36px;
    text-align: center;
    color: var(--dim);
    background: var(--panel);
    border: 1px dashed var(--line);
    border-radius: 10px;
  }
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    backdrop-filter: blur(4px);
  }
  .modal .box {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 22px;
    width: 90%;
    max-width: 520px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.6);
  }
  .modal h3 { margin: 0 0 16px; font-size: 15px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 5px; }
  .field input, .field textarea {
    width: 100%;
    background: var(--panel2);
    border: 1px solid var(--line);
    color: var(--fg);
    padding: 8px 10px;
    border-radius: 6px;
    font: inherit;
    font-size: 12.5px;
  }
  .field input:focus, .field textarea:focus {
    outline: none;
    border-color: var(--accent);
  }
  .drop-box {
    border: 2px dashed var(--line);
    border-radius: 10px;
    padding: 40px 20px;
    text-align: center;
    background: var(--panel);
    cursor: pointer;
    transition: 0.2s;
  }
  .drop-box:hover, .drop-box.on {
    border-color: var(--accent);
    background: var(--panel2);
  }
  .bar {
    height: 7px;
    background: var(--panel2);
    border-radius: 4px;
    overflow: hidden;
    margin-top: 4px;
  }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
  .flex { display: flex; align-items: center; gap: 8px; }
  [data-copy] { cursor: pointer; }
</style>
</head>
<body>

<header>
  <h1><span id="dot" class="dot"></span> DeepSeek 智能网关</h1>
  <div class="meta">
    <span id="up">运行中</span>
    <span id="wasm-badge" class="tag t-dim">WASM 加速</span>
    <span id="healthy-badge" class="tag t-ok">健康度 1/1</span>
  </div>
  <div class="right">
    <span id="me" class="muted">已登录</span>
    <button class="btn" id="btn-chpw">修改密码</button>
    <button class="btn primary" id="btn-refresh">刷新数据</button>
    <button class="btn danger" id="btn-logout">登出</button>
  </div>
</header>

<nav>
  <button class="on" data-tab="dash">📊 仪表大盘</button>
  <button data-tab="accounts">👥 账号调度管理</button>
  <button data-tab="keys">🔑 API Key 管理</button>
  <button data-tab="usage">💎 Token 统计</button>
  <button data-tab="upload">📁 文件上传</button>
  <button data-tab="sessions">💬 活跃会话</button>
  <button data-tab="logs">📜 持久请求日志</button>
</nav>

<main>
  <!-- 1. 仪表大盘 -->
  <div class="tab" id="tab-dash">
    <div class="cards" id="cards"></div>
    <h2>最近请求动态</h2>
    <div id="recent"></div>
    <h2>异常与警告审计</h2>
    <div id="errors"></div>
  </div>

  <!-- 2. 账号调度管理 -->
  <div class="tab" id="tab-accounts" style="display:none">
    <h2>
      <span>账号调度池列表</span>
      <div class="flex">
        <button class="btn primary" id="btn-batch-proxy">⚡ 批量分配代理</button>
        <button class="btn" id="btn-reload-accs">重新载入</button>
      </div>
    </h2>
    <div id="accounts-table"></div>
  </div>

  <!-- 3. API Key 管理 -->
  <div class="tab" id="tab-keys" style="display:none">
    <h2>
      <span>API Key 授权列表</span>
      <button class="btn primary" id="btn-newkey">+ 新建 API Key</button>
    </h2>
    <div id="keys-table"></div>
  </div>

  <!-- 4. Token 统计 -->
  <div class="tab" id="tab-usage" style="display:none">
    <div class="cards" id="usage-cards"></div>
    <h2>
      <span>按 API Key 消耗</span>
      <button class="btn danger" id="btn-reset-usage">重置统计</button>
    </h2>
    <div id="usage-keys"></div>
    <h2>按 DeepSeek 账号消耗</h2>
    <div id="usage-acc"></div>
    <h2>按日期消耗历史</h2>
    <div id="usage-day"></div>
  </div>

  <!-- 5. 文件上传 -->
  <div class="tab" id="tab-upload" style="display:none">
    <h2>文件上传控制台</h2>
    <div class="drop-box" id="drop">
      <input type="file" id="file-input" multiple style="display:none">
      <div style="font-size:28px;margin-bottom:8px">📤</div>
      <div style="font-size:14px;font-weight:600">点击选择或拖拽图片 / 文档到此处上传</div>
      <div class="muted" style="margin-top:6px;font-size:12px">支持常见图片格式 (PNG, JPG, WEBP, SVG) 及各类代码文本文档 (PDF, DOCX, TXT, JSON, MD)</div>
    </div>
    <h2>已上传文件列表</h2>
    <div id="upload-list"></div>
  </div>

  <!-- 6. 活跃会话 -->
  <div class="tab" id="tab-sessions" style="display:none">
    <h2>
      <span>活跃上下文会话 (Sessions)</span>
      <button class="btn danger" id="btn-clean-sess">一键清理超时会话</button>
    </h2>
    <div id="sessions-table"></div>
  </div>

  <!-- 7. 持久请求日志 -->
  <div class="tab" id="tab-logs" style="display:none">
    <h2>
      <span>请求审计日志 (实时落盘)</span>
      <div class="flex">
        <select id="log-filter-status" class="btn" style="background:var(--panel2)">
          <option value="">全部状态</option>
          <option value="ok">仅看成功 (200)</option>
          <option value="err">仅看失败 (Error)</option>
        </select>
        <button class="btn" id="btn-refresh-logs">刷新日志</button>
      </div>
    </h2>
    <div id="logs-table"></div>
  </div>
</main>

<!-- 登录弹窗 -->
<div class="modal" id="loginModal" style="display:none">
  <div class="box">
    <h3>DeepSeek 网关管理员登录</h3>
    <div class="field">
      <label>用户名</label>
      <input id="l-user" value="admin" autocomplete="username">
    </div>
    <div class="field">
      <label>密码</label>
      <input id="l-pass" type="password" value="admin123" autocomplete="current-password">
    </div>
    <div id="l-err" style="color:var(--err);font-size:12px;margin-bottom:10px;display:none"></div>
    <div class="flex" style="justify-content:flex-end">
      <button class="btn primary" id="l-sub">登录控制台</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtNum = n => Number(n||0).toLocaleString();
const fmtMs = ms => ms ? (ms < 1000 ? ms + 'ms' : (ms / 1000).toFixed(2) + 's') : '-';
const fmtTime = t => t ? new Date(t).toLocaleTimeString('zh-CN', { hour12: false }) : '-';

async function api(path, opts = {}) {
  const r = await fetch(path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
  });
  if (r.status === 401 && path !== '/api/login') {
    showLogin();
    const err = new Error('未登录或会话已过期');
    err.status = 401;
    throw err;
  }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || j.msg || ('HTTP ' + r.status));
  return j;
}

function showLogin() { $('loginModal').style.display = 'flex'; }
function hideLogin() { $('loginModal').style.display = 'none'; }

// ---------- Tab 切换 ----------
document.querySelectorAll('nav button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('nav button').forEach(x => x.classList.remove('on'));
    document.querySelectorAll('.tab').forEach(x => x.style.display = 'none');
    b.classList.add('on');
    const t = $('tab-' + b.dataset.tab);
    if (t) t.style.display = 'block';
    loadTab(b.dataset.tab);
  };
});

function loadTab(tab) {
  if (tab === 'dash') loadDash();
  else if (tab === 'accounts') loadAccounts();
  else if (tab === 'keys') loadKeys();
  else if (tab === 'usage') loadUsage();
  else if (tab === 'upload') loadUploads();
  else if (tab === 'sessions') loadSessions();
  else if (tab === 'logs') loadLogs();
}

function card(k, v, s) {
  return `<div class="card"><div class="k">${esc(k)}</div><div class="v">${v}</div>${s ? `<div class="s">${s}</div>` : ''}</div>`;
}

// 1. 仪表大盘
async function loadDash() {
  let d;
  try {
    d = await api('/v1/stats');
    $('dot').className = 'dot';
  } catch(e) {
    $('dot').className = 'dot off';
    return;
  }
  const r = d.requests, p = d.pool || {};
  $('up').textContent = '运行 ' + d.uptimeHuman;
  $('wasm-badge').textContent = d.wasmAcceleration ? '⚡ WASM 加速开启' : 'JS 求解';
  $('wasm-badge').className = d.wasmAcceleration ? 'tag t-ok' : 'tag t-warn';
  const healthyN = p.healthyAccounts != null ? p.healthyAccounts : p.healthy;
  const totalN = p.accounts != null ? p.accounts : 0;
  $('healthy-badge').textContent = `健康账号: ${healthyN}/${totalN}`;

  $('cards').innerHTML = [
    card('总请求数', fmtNum(r.total), r.perSec + ' req/s'),
    card('成功 / 失败', `<span style="color:var(--ok)">${fmtNum(r.ok)}</span> / <span style="color:${r.err?'var(--err)':'var(--dim)'}">${fmtNum(r.err)}</span>`, r.err ? '存在异常调用' : '100% 成功'),
    card('平均延迟', fmtMs(r.avgLatencyMs), '端到端往返耗时'),
    card('健康账号', `<span style="color:var(--ok)">${fmtNum(healthyN)}</span> / ${fmtNum(totalN)}`, '当前就绪账号数'),
    card('并发在途', fmtNum(p.totalInflight || 0), '当前处理中并发数'),
    card('活跃会话', fmtNum(p.activeSessions || 0), '上下文轮数保持'),
    card('流式输出', fmtNum(r.stream), 'SSE 实时传输'),
    card('工具调用', fmtNum(r.withTools), 'Function Calling'),
    card('思考链', fmtNum(r.withThinking), 'Reasoning 模型输出'),
    card('联网搜索', fmtNum(r.withSearch), 'Web Search 引用'),
  ].join('');

  const recent = d.recent || [];
  $('recent').innerHTML = recent.length ? '<table><thead><tr>' +
    ['时间','端点','状态','耗时','特性','账号','Key'].map(h=>'<th>'+h+'</th>').join('') +
    '</tr></thead><tbody>' + recent.slice(0, 15).map(q => '<tr>' +
      '<td class="muted">'+fmtTime(q.at)+'</td><td><code>'+esc(q.endpoint)+'</code></td>' +
      '<td><span class="tag '+(q.ok?'t-ok':'t-err')+'">'+q.status+'</span></td>' +
      '<td>'+fmtMs(q.ms)+'</td>' +
      '<td>'+[q.stream?'流式':'', q.tools?'工具':'', q.thinking?'思考':'', q.search?'联网':''].filter(Boolean).map(x=>'<span class="tag t-info">'+x+'</span>').join(' ')+'</td>' +
      '<td><b>'+esc(q.account||'-')+'</b></td>' +
      '<td class="muted">'+esc(q.keyName||'-')+'</td>' +
    '</tr>').join('') + '</tbody></table>' : '<div class="empty">暂无 API 调用记录</div>';

  $('errors').innerHTML = (d.errors && d.errors.length) ? d.errors.map(e => `
    <div style="background:var(--panel2);border-left:3px solid var(--err);padding:10px 14px;margin-bottom:8px;border-radius:4px">
      <b>${fmtTime(e.at)}</b> <code>${esc(e.endpoint)}</code><br>
      <span style="color:var(--err)">${esc(e.error)}</span>
    </div>
  `).join('') : '<div class="empty">无异常记录 🎉</div>';
}

// 2. 账号管理
async function loadAccounts() {
  let d;
  try { d = await api('/api/accounts'); } catch(e) {
    $('accounts-table').innerHTML = '<div class="empty">账号加载失败: ' + esc(e.message) + '</div>';
    return;
  }
  const accs = d.accounts || [];

  $('accounts-table').innerHTML = accs.length ? '<table><thead><tr>' +
    ['账号名称','代理 (Proxy)','Token 凭证状态','当前调度状态','并发 / 成功 / 失败','最后一次诊断','操作'].map(h=>'<th>'+h+'</th>').join('') +
    '</tr></thead><tbody>' + accs.map(a => {
      let stateTag = '<span class="tag t-ok">健康活跃</span>';
      if (a.state === 'auth_failed') stateTag = '<span class="tag t-err">Token 失效 (熔断)</span>';
      else if (a.paused) stateTag = '<span class="tag t-warn">已暂停调度</span>';
      else if (a.state === 'cooldown') stateTag = `<span class="tag t-warn">冷却中 (${a.cooldownSec}s)</span>`;
      else if (a.disabled) stateTag = '<span class="tag t-dim">手动停用</span>';

      const idAttr = `data-i="${a.index}" data-token-masked="${esc(a.token)}"`;
      const proxyDisplay = a.proxy
        ? `<span class="flex" style="gap:4px"><code style="font-size:11px;color:var(--accent,#4dabf7)">${esc(a.proxy)}</code><button class="btn btn-edit-acc" data-i="${a.index}" style="padding:1px 5px;font-size:10px" title="修改代理">改</button></span>`
        : `<button class="btn btn-edit-acc" data-i="${a.index}" style="font-size:11px;padding:2px 7px;color:var(--warn)" title="为该账号配置独立代理">+配代理</button>`;
      return '<tr>' +
        `<td><b>${esc(a.name)}</b>` +
          `<div class="muted" style="font-size:11px">${esc(a.email || a.mobile || (a.hasPassword ? '已配置密码' : '仅 Token'))}</div></td>` +
        `<td>${proxyDisplay}</td>` +
        `<td><code title="点击复制真实 Token（需登录）" class="btn-copy-token" ${idAttr} style="cursor:pointer">${esc(a.token.slice(0, 12))}…</code></td>` +
        `<td>${stateTag}</td>` +
        `<td>在途: <b>${a.inflight||0}</b> | <span style="color:var(--ok)">${a.ok||0}</span> / <span style="color:var(--err)">${a.err||0}</span></td>` +
        `<td><span style="font-size:11px;color:${a.lastError?'var(--err)':'var(--dim)'}">${esc(a.lastError || '正常运行无异常')}</span></td>` +
        `<td><div class="flex">` +
          `<button class="btn primary btn-test-acc" data-i="${a.index}">连通测试</button>` +
          `<button class="btn btn-tog-acc" data-i="${a.index}" data-p="${!a.paused}">${a.paused?'恢复调度':'暂停'}</button>` +
          `<button class="btn btn-edit-acc" data-i="${a.index}">编辑账号</button>` +
          `<button class="btn danger btn-del-acc" data-i="${a.index}">删除</button>` +
        `</div></td>` +
      '</tr>';
    }).join('') + '</tbody></table>' : '<div class="empty">账号池为空，请在 accounts.json 或 Studio 中管理账号并同步喵</div>';

  bindAccountEvents(accs);
}

function bindAccountEvents(accs) {
  document.querySelectorAll('[data-copy]').forEach(c => c.onclick = () => {
    navigator.clipboard.writeText(c.dataset.copy);
    const old = c.textContent;
    c.textContent = '已复制';
    setTimeout(() => c.textContent = old, 800);
  });

  // 复制真实 Token：先拉 reveal=1 明文，再写剪贴板
  document.querySelectorAll('.btn-copy-token').forEach(c => c.onclick = async () => {
    try {
      const d = await api('/api/accounts?reveal=1');
      const a = (d.accounts || []).find(x => String(x.index) === c.dataset.i);
      if (!a || !a.token) { alert('该账号没有 Token'); return; }
      await navigator.clipboard.writeText(a.token);
      const old = c.textContent;
      c.textContent = '已复制';
      setTimeout(() => c.textContent = old, 800);
    } catch(e) {
      alert('复制失败: ' + e.message);
    }
  });

  document.querySelectorAll('.btn-test-acc').forEach(b => b.onclick = async () => {
    const idx = b.dataset.i;
    b.disabled = true;
    b.textContent = '探测中...';
    try {
      const res = await api(`/api/accounts/${idx}/test`, { method: 'POST' });
      alert(res.message || '探测成功，Token 有效！');
    } catch(e) {
      alert('探测失败: ' + e.message);
    } finally {
      loadAccounts();
    }
  });



  document.querySelectorAll('.btn-tog-acc').forEach(b => b.onclick = async () => {
    const idx = b.dataset.i;
    const shouldPause = b.dataset.p === 'true';
    try {
      await api(`/api/accounts/${idx}/${shouldPause ? 'pause' : 'resume'}`, { method: 'POST' });
      loadAccounts();
    } catch(e) { alert('操作失败: ' + e.message); }
  });

  document.querySelectorAll('.btn-edit-acc').forEach(b => b.onclick = async () => {
    const idx = b.dataset.i;
    let a;
    try {
      // 编辑用明文（已登录才有权限），避免打码串覆盖真 Token
      const d = await api('/api/accounts?reveal=1');
      a = (d.accounts || []).find(x => String(x.index) === idx);
      if (!a) throw new Error('账号不存在');
    } catch(e) {
      alert('读取账号失败: ' + e.message);
      return;
    }
    openModal('编辑账号 ' + a.name, [
      ['账号名称', 'name', 'text', a.name],
      ['邮箱 (自动登录用，可空)', 'email', 'text', a.email],
      ['手机号 (自动登录用，可空)', 'mobile', 'text', a.mobile],
      ['区号 (手机默认 +86)', 'areaCode', 'text', a.areaCode],
      ['登录密码 (自动登录/换 Token 用)', 'password', 'password', a.password],
      ['代理 (每账号固定出口 IP，可空；如 http://user:pass@host:port)', 'proxy', 'text', a.proxy || ''],
      ['userToken (留空 = 不修改；可粘贴浏览器 token 或 JSON)', 'token', 'textarea', a.token],
    ], async val => {
      const patch = { ...val };
      // 空 token 表示不修改
      if (!String(patch.token || '').trim()) delete patch.token;
      if (patch.proxy !== undefined && patch.proxy !== null) patch.proxy = String(patch.proxy || '').trim();
      await api('/api/accounts/' + a.index, { method: 'PATCH', body: JSON.stringify(patch) });
      loadAccounts();
    });
  });

  document.querySelectorAll('.btn-del-acc').forEach(b => b.onclick = async () => {
    if (!confirm('确定删除该账号？')) return;
    try {
      await api('/api/accounts/' + b.dataset.i, { method: 'DELETE' });
      loadAccounts();
    } catch(e) { alert('删除失败: ' + e.message); }
  });
}


$('btn-reload-accs').onclick = async () => {

const batchProxyBtn = $('btn-batch-proxy');
if (batchProxyBtn) {
  batchProxyBtn.onclick = async () => {
    let d;
    try { d = await api('/api/accounts'); } catch(e) { return alert('获取账号失败: ' + e.message); }
    const accs = d.accounts || [];
    if (!accs.length) return alert('当前没有账号可分配代理');
    openModal('⚡ 批量分配账号代理池（每行一个）', [
      ['代理列表（支持 HTTP/HTTPS/SOCKS5，每行一个）', 'proxies', 'textarea', 'http://127.0.0.1:7890\nsocks5://127.0.0.1:10808'],
    ], async val => {
      const lines = String(val.proxies || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      if (!lines.length) throw new Error('请至少填入一个代理地址');
      let updated = 0;
      for (let i = 0; i < accs.length; i++) {
        const proxy = lines[i % lines.length];
        await api('/api/accounts/' + accs[i].index, {
          method: 'PATCH',
          body: JSON.stringify({ proxy })
        });
        updated++;
      }
      alert('成功为 ' + updated + ' 个账号轮询分配独立代理！');
      loadAccounts();
    });
  };
}

// 3. API Key 管理
async function loadKeys() {
  let d;
  try { d = await api('/api/keys'); } catch(e) {
    $('keys-table').innerHTML = '<div class="empty">密钥加载失败: ' + esc(e.message) + (e.status === 401 ? '（请先登录）' : '') + '</div>';
    return;
  }
  const keys = d.keys || [];

  $('keys-table').innerHTML = keys.length ? '<table><thead><tr>' +
    ['名称','API Key 凭证','状态','总请求','Token 消耗 (入 / 出 / 想)','最后使用','操作'].map(h=>'<th>'+h+'</th>').join('') +
    '</tr></thead><tbody>' + keys.map(k => {
      const st = k.stats || {};
      const tot = (st.promptTokens||0) + (st.completionTokens||0) + (st.thinkingTokens||0);
      const keyShown = (k.key && k.key.length > 20) ? (k.key.slice(0, 16) + '…' + k.key.slice(-4)) : (k.key || '');
      return '<tr>' +
        `<td><b>${esc(k.name)}</b>${k.note?`<div class="muted" style="font-size:11px">${esc(k.note)}</div>`:''}</td>` +
        `<td><code title="点击复制完整 Key" data-copy="${esc(k.key)}" style="cursor:pointer">${esc(keyShown)}</code></td>` +
        `<td>${k.enabled ? '<span class="tag t-ok">生效中</span>' : '<span class="tag t-dim">已停用</span>'}</td>` +
        `<td>${fmtNum(st.requests)} <span class="muted">(${st.ok||0} 成功)</span></td>` +
        `<td><b>${fmtNum(tot)}</b> <span class="muted">(${st.promptTokens||0} / ${st.completionTokens||0} / ${st.thinkingTokens||0})</span></td>` +
        `<td class="muted">${k.lastUsedAt ? fmtTime(k.lastUsedAt) : '从未调用'}</td>` +
        `<td><div class="flex">` +
          `<button class="btn btn-tog-key" data-kid="${k.id}" data-en="${!k.enabled}">${k.enabled?'停用':'启用'}</button>` +
          `<button class="btn danger btn-del-key" data-kid="${k.id}">删除</button>` +
        `</div></td>` +
      '</tr>';
    }).join('') + '</tbody></table>' : '<div class="empty">暂未创建 API Key，点击上方按钮创建</div>';

  document.querySelectorAll('#keys-table [data-copy]').forEach(c => c.onclick = () => {
    navigator.clipboard.writeText(c.dataset.copy);
    const old = c.textContent;
    c.textContent = '已复制完整 Key';
    setTimeout(() => c.textContent = old, 1200);
  });
  document.querySelectorAll('.btn-tog-key').forEach(b => b.onclick = async () => {
    try {
      await api('/api/keys/' + b.dataset.kid, { method: 'PATCH', body: JSON.stringify({ enabled: b.dataset.en === 'true' }) });
      loadKeys();
    } catch(e) { alert('操作失败: ' + e.message); }
  });
  document.querySelectorAll('.btn-del-key').forEach(b => b.onclick = async () => {
    if (!confirm('确定删除该 Key？')) return;
    try {
      await api('/api/keys/' + b.dataset.kid, { method: 'DELETE' });
      loadKeys();
    } catch(e) { alert('删除失败: ' + e.message); }
  });
}

$('btn-newkey').onclick = () => openModal('创建 API Key', [
  ['Key 名称', 'name', 'text', 'Default-Key'],
  ['备注描述 (可选)', 'note', 'text', '用于本地/客户端调用'],
], async val => {

});

$('drop').onclick = () => $('file-input').click();
$('file-input').onchange = async () => {
  await doUpload([...$('file-input').files]);
  $('file-input').value = '';
};
['dragover', 'dragenter'].forEach(ev => $('drop').addEventListener(ev, e => {
  e.preventDefault();
  $('drop').classList.add('on');
}));
['dragleave', 'drop'].forEach(ev => $('drop').addEventListener(ev, e => {
  e.preventDefault();
  $('drop').classList.remove('on');
}));
$('drop').addEventListener('drop', e => doUpload([...e.dataTransfer.files]));

async function doUpload(files) {
  for (const f of files) {
    const fd = new FormData();
    fd.append('files', f);
    try {
      const r = await fetch('/v1/files', { method: 'POST', body: fd });
      const j = await r.json();
      if (!r.ok) alert('上传失败: ' + (j.error || '未知错误'));
    } catch(e) {
      alert('上传异常: ' + e.message);
    }
  }
  loadUploads();
}

// ---------- 模态弹窗机制 ----------
function openModal(title, fields, onSubmit) {
  const el = document.createElement('div');
  el.className = 'modal';
  el.innerHTML = `
    <div class="box">
      <h3>${esc(title)}</h3>
      ${fields.map(f => `
        <div class="field">
          <label>${esc(f[0])}</label>
          ${f[2] === 'textarea' ? `<textarea id="m-${f[1]}" rows="3">${esc(f[3]||'')}</textarea>` : `<input id="m-${f[1]}" type="${f[2]||'text'}" value="${esc(f[3]||'')}">`}
        </div>
      `).join('')}
      <div class="flex" style="justify-content:flex-end">
        <button class="btn cancel">取消</button>
        <button class="btn primary submit">确认提交</button>
      </div>
    </div>
  `;
  document.body.appendChild(el);

  el.querySelector('.cancel').onclick = () => el.remove();
  el.querySelector('.submit').onclick = async () => {
    const val = {};
    fields.forEach(f => {
      val[f[1]] = el.querySelector('#m-' + f[1]).value;
    });
    try {
      await onSubmit(val);
      el.remove();
    } catch(e) {
      alert('操作失败: ' + e.message);
    }
  };
}

function openForceChangePassword() {
  openModal('必须修改初始密码后才能继续', [
    ['旧密码 (当前密码)', 'oldPassword', 'password'],
    ['新密码 (至少 4 位)', 'newPassword', 'password'],
    ['重复新密码', 'confirmPassword', 'password'],
  ], async v => {
    if (v.newPassword !== v.confirmPassword) throw new Error('两次新密码不一致');
    await api('/api/change-password', { method: 'POST', body: JSON.stringify({
      oldPassword: v.oldPassword,
      newPassword: v.newPassword,
    })});
    alert('密码修改成功，正在进入控制台喵！');
    boot();
  });
}

  ['旧密码 (当前密码)', 'oldPassword', 'password'],
  ['新密码 (至少 4 位)', 'newPassword', 'password'],
  ['重复新密码', 'confirmPassword', 'password'],
], async v => {

  await api('/api/change-password', { method: 'POST', body: JSON.stringify({

$('btn-refresh').onclick = () => {

async function boot() {
  try {
    const me = await api('/api/me');
    $('me').textContent = '已登录: ' + me.username;
    hideLogin();
    if (me.mustChangePassword) {
      openForceChangePassword();
      return;
    }
    loadDash();
  } catch(e) {
    showLogin();
  }
}

boot();
setInterval(() => {
  const active = document.querySelector('nav button.on');
  if (active && active.dataset.tab === 'dash') loadDash();
}, 4000);
