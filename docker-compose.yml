version: '3.8'

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: ds-gateway:latest
    container_name: ds-gateway
    restart: unless-stopped
    ports:
      - "${PORT:-19728}:19728"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=19728
    volumes:
      # 持久化挂载：配置文件、Token 统计与历史日志保存在宿主机项目目录下
      - ./data:/app/data
      - ./logs:/app/logs
    # 容器资源上限（适配低配 VPS 或本地轻量运行）
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:19728/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
